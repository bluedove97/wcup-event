services:
  wcup-event:
    build: .
    image: wcup-event:latest
    container_name: wcup-event
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # DB (pg 라이브러리 표준 변수명)
      - PGHOST=192.168.219.184
      - PGPORT=5432
      - PGDATABASE=pidb
      - PGUSER=pipg
      - PGPASSWORD=pipg12#$
      # 세션 시크릿 — 반드시 강력한 랜덤 문자열로 교체
      - USER_SESSION_SECRET=CHANGE_ME_USER_SECRET
      - ADMIN_SESSION_SECRET=CHANGE_ME_ADMIN_SECRET
      # 관리자 계정
      - ADMIN_ID=admin
      - ADMIN_PASSWORD=CHANGE_ME_ADMIN_PASSWORD
      # 참여 허용 사용자 (쉼표 구분)
      - ALLOWED_USERS=홍길동,김철수,이영희
